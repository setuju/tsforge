name: Regenerate Demo GIF

on:
  push:
    paths:
      - 'tsforge.sh'
      - 'demo.tape'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install VHS, ttyd, ffmpeg, and fonts
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key \
            | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" \
            | sudo tee /etc/apt/sources.list.d/charm.list
          sudo apt update
          sudo apt install -y vhs ffmpeg unzip wget
          
          curl -fsSL https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64 \
            -o /usr/local/bin/ttyd
          sudo chmod +x /usr/local/bin/ttyd
          
          mkdir -p ~/.local/share/fonts
          wget -q https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip \
            -O /tmp/jbmono.zip
          unzip -q /tmp/jbmono.zip -d /tmp/jbmono
          cp /tmp/jbmono/fonts/ttf/*.ttf ~/.local/share/fonts/
          fc-cache -f -v

      - name: Generate demo GIF
        id: vhs
        continue-on-error: true
        run: |
          vhs demo.tape
          if [ -f demo.gif ] && [ -s demo.gif ]; then
            echo "✅ demo.gif generated ($(du -h demo.gif | cut -f1))"
          else
            echo "⚠️ VHS did not produce a valid demo.gif"
            ls -la
            exit 1
          fi

      - name: Commit and push if changed
        if: steps.vhs.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo.gif
          if git diff --staged --quiet; then
            echo "✅ demo.gif unchanged"
          else
            git commit -m "chore: regenerate demo.gif [skip ci]"
            git push
          fi
